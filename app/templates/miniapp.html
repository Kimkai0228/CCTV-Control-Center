<!DOCTYPE html>
<html lang="en" data-theme="{{ config.theme or 'light' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="{{ config.colors.primary }}">
  <title>{{ config.app_name }} · MiniApp</title>
  <style>
    :root{ --bg: {{ config.colors.background or '#F4EEFF' }}; --primary: {{ config.colors.primary or '#424874' }}; --secondary: {{ config.colors.secondary or '#A6B1E1' }}; --accent: {{ config.colors.accent or '#DCD6F7' }}; }
  </style>
  <link rel="stylesheet" href="/static/css/app.css">
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>try{var t=localStorage.getItem('cctv-theme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}</script>
</head>
<body data-page="miniapp">
<div class="mini-shell">
  <header class="mini-header">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h11v8H3z"/><path d="m14 11 7-4v10l-7-4z"/><circle cx="7" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg>
    </span>
    <div style="flex:1;min-width:0">
      <div class="strong" style="font-size:.92rem">{{ config.app_name }}</div>
      <div class="tiny faint" id="mini-user">Connecting…</div>
    </div>
    <button class="icon-btn" data-theme-toggle aria-label="Theme"></button>
    <a class="icon-btn" href="/" title="Open WebUI" aria-label="WebUI">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M3 9h6"/></svg>
    </a>
  </header>

  <div class="mini-tabs">
    <button class="mini-tab active" data-panel="panel-new">🎬 New request</button>
    <button class="mini-tab" data-panel="panel-jobs">📋 My jobs <span class="badge no-dot" id="job-count" style="margin-left:4px">0</span></button>
  </div>

  <div id="mini-loading" class="stack">
    <div class="skeleton" style="height:90px"></div>
    <div class="skeleton" style="height:190px"></div>
    <div class="skeleton" style="height:120px"></div>
  </div>

  <div id="mini-error" class="card card-pad hide">
    <h3>Open inside Telegram</h3>
    <p class="small muted mt-1" id="mini-error-text">This MiniApp needs a Telegram session. Use /tkbaboy in the CCTV group, or sign in to the WebUI first.</p>
    <a class="btn btn-block mt-2" href="/login">Sign in to WebUI</a>
  </div>

  <div id="mini-app" class="hide">
    <section class="mini-panel active" id="panel-new">
      <div class="card card-pad stack">
        <div class="form-grid">
          <div class="field"><label>Date</label><input class="input" type="date" id="m-date"></div>
          <div class="field"><label>Time range</label>
            <div class="input-group"><input class="input" type="time" id="m-start"><input class="input" type="time" id="m-end"></div>
          </div>
          <div class="field"><label>Campus</label><select class="select" id="m-campus"></select></div>
          <div class="field"><label>Zone</label><select class="select" id="m-zone"></select></div>
          <div class="field span-2"><label>Folder / incident name</label><input class="input" id="m-folder" placeholder="Custom folder name"></div>
        </div>

        <div class="divider"></div>
        <div class="row-between">
          <div><div class="label">Cameras</div><div class="tiny faint" id="m-selected-label">0 selected</div></div>
          <div class="row"><button type="button" class="btn btn-ghost btn-xs" id="m-select-all">Select all</button><button type="button" class="btn btn-ghost btn-xs" id="m-clear">Clear</button></div>
        </div>
        <div id="m-cameras" class="stack" style="gap:12px"></div>

        <details>
          <summary class="small strong" style="cursor:pointer;color:var(--text-soft)">More options</summary>
          <div class="form-grid mt-2">
            <div class="field"><label>Incident description</label><input class="input" id="m-incident" placeholder="What happened?"></div>
            <div class="field"><label>Requester email</label><input class="input" id="m-email" type="email" placeholder="name@school.edu.kh"></div>
            <div class="field span-2"><label>Destination</label><select class="select" id="m-destination"></select></div>
          </div>
        </details>
      </div>
    </section>

    <section class="mini-panel" id="panel-jobs">
      <div id="m-jobs" class="stack" style="gap:9px"></div>
    </section>
  </div>
</div>

<div class="mini-bottom" id="mini-bottom">
  <div class="inner">
    <div class="mini-summary" id="m-summary">Select cameras to begin</div>
    <button class="btn btn-block" id="m-submit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M4 21h16"/></svg>
      Start extraction
    </button>
  </div>
</div>

<div id="toasts"></div>
<script src="/static/js/app.js"></script>
<script src="/static/js/miniapp.js"></script>
</body>
</html>
